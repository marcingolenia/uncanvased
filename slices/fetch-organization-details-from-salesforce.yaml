slice: Fetch Organization Details From Salesforce
pattern: automation
actor: System Agent (Salesforce Sync Service)
trigger: { view: PendingOrganizationRequestsView }
processor: SalesforceSyncService
external_call:
  system: Salesforce API
  action: "GET /services/data/v60.0/sobjects/Account/{salesforceOrgId}"
command:
  name: RecordOrganizationDetails
  payload: { salesforceOrgId: string, name: string, domain: string, employeeCount: int, source: string, observedAt: datetime }
event:
  name: OrganizationDetailsRecorded
  tags: [salesforceOrgId]
  fields:
    salesforceOrgId: string
    name: string
    domain: string
    employeeCount: int
    source: string
    observedAt: datetime
scenarios:
  - name: Records Salesforce details for a pending organization request
    given:
      - view: PendingOrganizationRequestsView
        data: { salesforceOrgId: "SF-100", status: "PENDING" }
    when:
      command: RecordOrganizationDetails
      payload: { salesforceOrgId: "SF-100", name: "Acme Inc", domain: "acme.com", employeeCount: 120, source: "Salesforce", observedAt: "2026-07-22T10:00:00Z" }
    then:
      event: OrganizationDetailsRecorded
      data: { salesforceOrgId: "SF-100", name: "Acme Inc", domain: "acme.com", employeeCount: 120, source: "Salesforce", observedAt: "2026-07-22T10:00:00Z" }
