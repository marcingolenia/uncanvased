slice: Request Organization Details
pattern: state_change
actor: Operator
ui:
  screen: Merge Organizations
  inputs:
    - { field: salesforceOrgId, type: string }
  trigger: { label: "Load details", command: RequestOrganizationDetails }
command:
  name: RequestOrganizationDetails
  payload: { salesforceOrgId: string }
event:
  name: OrganizationDetailsRequested
  tags: [salesforceOrgId]
  fields: { salesforceOrgId: string }
scenarios:
  - name: Requests organization details from Salesforce
    given: []
    when: { command: RequestOrganizationDetails, payload: { salesforceOrgId: "SF-100" } }
    then: { event: OrganizationDetailsRequested, data: { salesforceOrgId: "SF-100" } }