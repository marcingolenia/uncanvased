slice: Merge Organizations
pattern: state_change
actor: Operator
ui:
  screen: Merge Organizations
  inputs:
    - { field: survivingOrgId, type: string }
    - { field: mergedOrgId, type: string }
  trigger: { label: "Merge", command: MergeOrganizations }
command:
  name: MergeOrganizations
  payload: { survivingOrgId: string, mergedOrgId: string }
event:
  name: OrganizationsMerged
  tags: [survivingOrgId]
  fields: { survivingOrgId: string, mergedOrgId: string }
constraints:
  - "Both organizations must have recorded details (OrganizationDetailsRecorded) on the timeline before merging."
scenarios:
  - name: Merges two organizations once both profiles are on the timeline
    given:
      - event: OrganizationDetailsRecorded
        data: { salesforceOrgId: "SF-100", name: "Acme Inc", domain: "acme.com", employeeCount: 120, source: "Salesforce", observedAt: "2026-07-22T10:00:00Z" }
      - event: OrganizationDetailsRecorded
        data: { salesforceOrgId: "SF-205", name: "Acme Incorporated", domain: "acme.com", employeeCount: 118, source: "Salesforce", observedAt: "2026-07-22T10:01:00Z" }
    when: { command: MergeOrganizations, payload: { survivingOrgId: "SF-100", mergedOrgId: "SF-205" } }
    then: { event: OrganizationsMerged, data: { survivingOrgId: "SF-100", mergedOrgId: "SF-205" } }
  - name: Rejects the merge when one organization has no recorded details
    given:
      - event: OrganizationDetailsRecorded
        data: { salesforceOrgId: "SF-100", name: "Acme Inc", domain: "acme.com", employeeCount: 120, source: "Salesforce", observedAt: "2026-07-22T10:00:00Z" }
    when: { command: MergeOrganizations, payload: { survivingOrgId: "SF-100", mergedOrgId: "SF-205" } }
    then: { exception: OrganizationNotRecorded, message: "SF-205 has no recorded details to merge", emits: none }